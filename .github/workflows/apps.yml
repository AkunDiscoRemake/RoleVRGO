name: Apps (APK e EXE)
on:
  push:
    branches: [main, master, ccr-7296b89f-ryojp0]
    paths: ['apps/**', '.github/workflows/apps.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apps
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Gerar APK
        working-directory: apps/android
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../RoleVRGO.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: RoleVRGO.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Gerar EXE
        working-directory: apps/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false', GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never
          copy out\RoleVRGO.exe ..\..\RoleVRGO.exe
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: RoleVRGO.exe }
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: arq, merge-multiple: true }
      - name: Publicar na release "apps"
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          ls -la arq
          gh release delete apps -y --cleanup-tag || true
          gh release create apps arq/RoleVRGO.apk arq/RoleVRGO.exe --target "$GITHUB_SHA" --title "RoleVRGO — apps (Android e Windows)" --notes "APK para celular (com ou sem VR Box) e EXE para PC. Os dois abrem o jogo do site, então estão sempre atualizados. Baixe em https://akundiscoremake.github.io/RoleVRGO/baixar/"
